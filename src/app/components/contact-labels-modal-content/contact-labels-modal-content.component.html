<div class="search-contact-modal">
  <section class="header-area">
    <p>Lists</p>
    <img src="/assets/images/close-icon.png" alt="close-icon" style="cursor:pointer;"
         (click)="activeModal.close('Close click')" />
  </section>

  <section class="middle-area">
    <div class="labels-wrap">
      <!-- Items are either { list: {...} } (drip campaigns) or the list itself (contacts). -->
      <span *ngFor="let item of labels" class="label" [style.background-color]="(item.list ?? item).bgColor"
            [style.color]="(item.list ?? item).textColor">{{ (item.list ?? item).label }}</span>
    </div>
  </section>
</div>
