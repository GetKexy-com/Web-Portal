<div class="canvas-content-wrap non-hide-from-toggle">
  <div class="head-area non-hide-from-toggle">
    <div class="head-text non-hide-from-toggle">
      <p class="head-title non-hide-from-toggle">{{ canvasTitle }} List</p>
      <span class="head-subtitle non-hide-from-toggle">Group contacts so you can target them in drip campaigns</span>
    </div>
    <button type="button" class="close-btn non-hide-from-toggle" aria-label="Close"
            (click)="activeCanvas.dismiss('Cross click')">
      <i class="fa fa-times non-hide-from-toggle" aria-hidden="true"></i>
    </button>
  </div>

  <form class="canvas-form non-hide-from-toggle" [formGroup]="primaryForm" (ngSubmit)="handleSubmit()">
    <div class="canvas-body non-hide-from-toggle">
      <div class="form-section non-hide-from-toggle">
        <div class="section-head non-hide-from-toggle">
          <i class="fa fa-list-ul section-icon non-hide-from-toggle" aria-hidden="true"></i>
          <span class="section-title non-hide-from-toggle">List details</span>
        </div>

        <div class="field non-hide-from-toggle">
          <label class="field-label non-hide-from-toggle">List name</label>
          <input class="form-control non-hide-from-toggle" formControlName="label" type="text" placeholder="EX: HOT LEAD">
          <div *ngIf="formValidationErrorCheck('label')">
            <error-message-card message="Field is required!"></error-message-card>
          </div>
        </div>

        <div class="field non-hide-from-toggle">
          <label class="field-label non-hide-from-toggle">Color</label>
          <div class="colors-wrap non-hide-from-toggle">
            <button type="button" class="color-item non-hide-from-toggle"
                    *ngFor="let item of colorOptions"
                    [class.selected]="selectedColor && selectedColor.labelBgColor === item.labelBgColor"
                    [style.background-color]="item.labelBgColor"
                    [attr.aria-label]="'Select color ' + item.labelBgColor"
                    (click)="handleColorSelect(item)">
              <i *ngIf="selectedColor && selectedColor.labelBgColor === item.labelBgColor"
                 class="fa fa-check non-hide-from-toggle" aria-hidden="true"
                 [style.color]="item.labelTextColor"></i>
            </button>
          </div>
          <div *ngIf="formValidationErrorCheck('bgColor')">
            <error-message-card message="Field is required!"></error-message-card>
          </div>
        </div>

        <div class="preview non-hide-from-toggle" *ngIf="selectedColor">
          <span class="preview-label non-hide-from-toggle">Preview</span>
          <span class="preview-tag non-hide-from-toggle"
                [style.background-color]="selectedColor.labelBgColor"
                [style.color]="selectedColor.labelTextColor">
            {{ primaryForm.get('label')?.value || 'List name' }}
          </span>
        </div>
      </div>
    </div>

    <div class="buttons non-hide-from-toggle">
      <button class="blue-border-white-bg-button non-hide-from-toggle" type="button"
              (click)="activeCanvas.dismiss('Cross click')">Cancel</button>
      <button class="blue-button non-hide-from-toggle" type="submit" [disabled]="isLoading">
        <i *ngIf="isLoading" class="fa fa-spinner fa-spin me-2" aria-hidden="true"></i>Save
      </button>
    </div>
  </form>
</div>
