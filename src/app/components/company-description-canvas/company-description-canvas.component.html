<div class="canvas-content-wrap">
  <div class="head-area">
    <div class="head-text">
      <p class="head-title">{{ canvasTitle }} Company Description</p>
      <span class="head-subtitle">Details KEXY uses to write your cold emails</span>
    </div>
    <button type="button" class="close-btn" aria-label="Close" (click)="activeCanvas.dismiss('Cross click')">
      <i class="fa fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <form class="canvas-form" [formGroup]="primaryForm" (ngSubmit)="handleSubmit()">
    <div class="canvas-body">
      <div class="form-section">
        <div class="section-head">
          <i class="fa fa-building-o section-icon" aria-hidden="true"></i>
          <span class="section-title">Company details</span>
        </div>

        <div class="fields-grid">
          <div class="field full">
            <label class="field-label">Company Name</label>
            <input class="form-control" formControlName="companyName" type="text" placeholder="e.g. Acme Inc." />
            @if (formValidationErrorCheck('companyName')) {
              <error-message-card message="Field is required!"></error-message-card>
            }
          </div>

          <div class="field full">
            <label class="field-label">Company Description</label>
            <textarea class="form-control" formControlName="description"
                      placeholder="Describe your company — what it does, who it serves, and what makes it stand out…"></textarea>
            @if (formValidationErrorCheck('description')) {
              <error-message-card message="Field is required!"></error-message-card>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="blue-border-white-bg-button" type="button" (click)="activeCanvas.dismiss('Cross click')">
        Cancel
      </button>
      <button class="blue-button" type="submit" [disabled]="isLoading">
        @if (isLoading) {
          <i class="fa fa-spinner fa-spin me-2" aria-hidden="true"></i>
        }
        Save
      </button>
    </div>
  </form>
</div>
