<div class="canvas-content-wrap">
  <div class="head-area">
    <div class="head-text">
      <p class="head-title">{{ canvasTitle }} Campaign Title</p>
      <span class="head-subtitle">Give this drip campaign a name you'll recognize</span>
    </div>
    <button type="button" class="close-btn" aria-label="Close" (click)="activeCanvas.dismiss('Cross click')">
      <i class="fa fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <form class="canvas-form" [formGroup]="primaryForm" (ngSubmit)="handleSubmit()">
    <div class="canvas-body">
      <div class="form-section">
        <div class="section-head">
          <i class="fa fa-pencil section-icon" aria-hidden="true"></i>
          <span class="section-title">Title details</span>
        </div>

        <div class="field">
          <div class="field-label-row">
            <label class="field-label" for="campaign-title-input">Campaign title</label>
            <span class="char-count">{{ primaryForm.get('campaign_title')?.value?.length || 0 }}/50</span>
          </div>
          <input
            id="campaign-title-input"
            class="form-control"
            formControlName="campaign_title"
            type="text"
            maxlength="50"
            placeholder="EX: Q4 Restaurant Outreach"
          />
          @if (formValidationErrorCheck('campaign_title')) {
            <error-message-card message="Field is required!"></error-message-card>
          }
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="blue-border-white-bg-button" type="button" (click)="activeCanvas.dismiss('Cross click')">
        Cancel
      </button>
      <button class="blue-button" type="submit" [disabled]="isLoading">
        @if (isLoading) {
          <i class="fa fa-spinner fa-spin me-2" aria-hidden="true"></i>
        }
        Save
      </button>
    </div>
  </form>
</div>
