<div class="canvas-content-wrap">
  <div class="head-area">
    <div class="head-text">
      <p class="head-title">Insights</p>
      <span class="head-subtitle">Engagement for this email in the sequence</span>
    </div>
    <div class="head-actions">
      <app-kexy-button
        (click)="exportCSV()"
        [label]="exportBtnLoading ? 'Please wait...' : 'Export' "
        [iconLeft]="exportBtnLoading ? 'fa-refresh fa-spin' : 'fa-cloud-download'"
        bgColor="#ffffff"
        textColor="#095dd1"
        borderColor="#e2e8f0"
        radius="10px"
      ></app-kexy-button>
      <!--Export is a content action, Close dismisses the drawer — the rule keeps
          them from reading as one cluster.-->
      <span class="head-divider" aria-hidden="true"></span>
      <button type="button" class="close-btn" aria-label="Close" (click)="activeCanvas.dismiss('Cross click')">
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!--Read-only drawer: no form and no docked footer — Export lives in the header-->
  <div class="canvas-body">

    <!--Which email these numbers belong to + the one hero figure for the view-->
    <div class="summary-section">
      <div class="summary-text">
        <p class="email-eyebrow">Email #{{ email.emailSequence }}</p>
        <p class="email-subject">{{ email.emailSubject }}</p>
      </div>
      <div class="hero-stat">
        <span class="hero-label">Sent to</span>
        <span class="hero-value">{{ sentEmailCount }}</span>
      </div>
    </div>

    <!--Rate tiles: same metric family, so they share one treatment (no per-tile hue)-->
    <div class="kpi-row">
      <insights-statistics-card
        cardTitle="Open rate"
        [insightRate]="openRate"
      >
      </insights-statistics-card>
      <insights-statistics-card
        cardTitle="Click rate"
        [insightRate]="clickRate"
      >
      </insights-statistics-card>
      <insights-statistics-card
        cardTitle="Reply rate"
        [insightRate]="replyRate"
      >
      </insights-statistics-card>
    </div>

    <div class="insights-grid">
      <insights-contacts-or-links
        cardTitle="Top engaged contacts"
        [showTab]="true"
        [showContacts]="true"
        [clickedContacts]="topClickedContacts"
        [openedContacts]="topOpenedContacts"
        [isLoading]="isLoading"
      >
      </insights-contacts-or-links>
      <insights-contacts-or-links
        cardTitle="Top clicked links"
        [showLinks]="true"
        [links]="topClickedLinks"
        [isLoading]="isLoading"
      >
      </insights-contacts-or-links>
    </div>
  </div>
</div>
