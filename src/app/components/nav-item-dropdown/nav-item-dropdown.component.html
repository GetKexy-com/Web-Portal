<!-- Static section group (screenshot style): a small uppercase header label
     with its nav items always visible and uniformly aligned beneath it. In the
     collapsed rail the label becomes a short divider and items show as centred
     icons with hover tooltips (see brand-layout collapsed styles). -->
<li class="nav-section">
  <div class="nav-section-label" [attr.title]="label" [attr.data-section]="label">{{ label }}</div>
  <ul class="nav-section-items">
    <ng-content></ng-content>
  </ul>
</li>
