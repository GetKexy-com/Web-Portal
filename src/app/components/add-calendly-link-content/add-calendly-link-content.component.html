<div class="canvas-content-wrap">
  <div class="head-area">
    <div class="head-text">
      <p class="head-title">Add Calendly or Scheduling Link</p>
      <span class="head-subtitle">Where prospects go to book time with you</span>
    </div>
    <button type="button" class="close-btn" aria-label="Close" (click)="activeCanvas.dismiss('Cross click')">
      <i class="fa fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <form class="canvas-form" [formGroup]="primaryForm" (ngSubmit)="onSubmit()">
    <div class="canvas-body">
      <div class="form-section">
        <div class="section-head">
          <i class="fa fa-calendar section-icon" aria-hidden="true"></i>
          <span class="section-title">Link details</span>
        </div>

        <div class="field">
          <label class="field-label" for="calendly-link-input">Calendly or scheduling link</label>
          <input id="calendly-link-input" class="form-control" formControlName="calendly_link" type="text" placeholder="www.calendly.com/your-name" />
          <span class="field-hint">Prospects use this link to book a meeting.</span>
          @if (formValidationErrorCheck('calendly_link') || invalidWebsite) {
            <error-message-card message="Url is missing or invalid!"></error-message-card>
          }
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="blue-border-white-bg-button" type="button" (click)="activeCanvas.dismiss('Cross click')">
        Cancel
      </button>
      <button class="blue-button" type="submit" [disabled]="isLoading()">
        @if (isLoading()) {
          <i class="fa fa-spinner fa-spin me-2" aria-hidden="true"></i>
        }
        Save
      </button>
    </div>
  </form>
</div>
