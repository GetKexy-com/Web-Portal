<div class="lc-modal">
  <div class="modal-head">
    <div class="lc-head-text">
      <p class="modal-title-text">
        <span class="lc-badge" aria-hidden="true"><i class="fa fa-pencil"></i></span>
        Save changes to this campaign?
      </p>
      <p class="lc-sub">
        <span class="lc-status" [class.is-paused]="paused">{{ paused ? 'Paused' : 'Running' }}</span>
        <span class="lc-title" *ngIf="campaignTitle">{{ campaignTitle }}</span>
      </p>
    </div>
    <button type="button" class="icon-btn" aria-label="Keep editing" (click)="activeModal.dismiss()">
      <i class="fa fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <div class="lc-body">
    <p class="lc-section-label">
      You changed {{ changes.length }} setting{{ changes.length === 1 ? '' : 's' }}
    </p>
    <ul class="lc-changes">
      <li class="lc-change" *ngFor="let c of changes">
        <span class="lc-label">{{ c.label }}</span>
        <div class="lc-values">
          <span class="lc-before" [title]="c.before">{{ c.before }}</span>
          <i class="fa fa-long-arrow-right lc-arrow" aria-hidden="true"></i>
          <span class="lc-after" [title]="c.after">{{ c.after }}</span>
        </div>
      </li>
    </ul>

    <p class="lc-note">
      <i class="fa fa-info-circle" aria-hidden="true"></i>
      New emails will use the new settings. Emails already sent don't change.
    </p>
  </div>

  <div class="modal-foot">
    <button type="button" class="link-btn" (click)="activeModal.close('undo')">
      <i class="fa fa-undo" aria-hidden="true"></i> Undo changes
    </button>
    <div class="lc-foot-right">
      <button type="button" class="ghost-btn" (click)="activeModal.dismiss()">Keep editing</button>
      <button type="button" class="primary-btn" (click)="activeModal.close('save')" ngbAutofocus>
        Save changes
      </button>
    </div>
  </div>
</div>
