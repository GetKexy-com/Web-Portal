<div class="ldc-modal">
  <header class="ldc-header">
    <div class="ldc-heading">
      <h2 class="ldc-title">Used in drip campaigns</h2>
      <p class="ldc-subtitle" *ngIf="dripCampaigns?.length">
        {{ dripCampaigns.length }} campaign{{ dripCampaigns.length === 1 ? '' : 's' }} use this list
      </p>
    </div>
    <button type="button" class="ldc-close" aria-label="Close" (click)="activeModal.close('Close click')">
      <img src="/assets/images/close-icon.png" alt="" />
    </button>
  </header>

  <ul class="ldc-list" *ngIf="dripCampaigns?.length; else empty">
    <li *ngFor="let item of dripCampaigns" class="ldc-item">
      <!-- Opens the campaign in a new tab so the user keeps their place on Manage Lists. -->
      <a class="ldc-name"
         [routerLink]="'/' + editDripCampaignPath"
         [queryParams]="{ id: item.dripCampaign?.id }"
         target="_blank" rel="noopener"
         [title]="nameOf(item)">
        <span class="ldc-name-text">{{ nameOf(item) }}</span>
        <i class="fa fa-external-link ldc-open" aria-hidden="true"></i>
      </a>
      <span class="ldc-status" [ngClass]="'ldc-status-' + (item.dripCampaign?.status || 'unknown')">
        <span class="ldc-dot"></span>{{ statusLabel(item.dripCampaign?.status) }}
      </span>
    </li>
  </ul>

  <ng-template #empty>
    <p class="ldc-empty">No drip campaigns found.</p>
  </ng-template>
</div>
