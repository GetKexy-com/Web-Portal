<!--Shared stepper (brand-drip-campaign, landing-page-create, brand-find-leads).
    Labels sit BESIDE each marker in normal flow rather than absolutely positioned
    under it, and the connector is a flex item instead of a fixed 138px — so the row
    adapts to any number of steps and any label length without overlapping.-->
<ol class="progress-count" [attr.aria-label]="'Step ' + currentStep + ' of ' + steps?.length">
  <li
    class="step"
    *ngFor="let step of steps; let i = index; let last = last"
    [class.active]="step.no === currentStep"
    [class.completed]="step.no < currentStep"
    [attr.aria-current]="step.no === currentStep ? 'step' : null"
  >
    <span class="marker" aria-hidden="true">
      <!--A glyph, not an image asset: it inherits colour and needs no network round
          trip (this replaced double-check-white.png).-->
      <i *ngIf="step.no < currentStep" class="fa fa-check"></i>
      <span *ngIf="step.no >= currentStep">{{ step.no }}</span>
    </span>

    <span class="step-text">
      <span class="step-eyebrow">Step {{ step.no }}</span>
      <span class="step-title">{{ step.title }}</span>
    </span>

    <span *ngIf="!last" class="connector" aria-hidden="true"></span>
  </li>
</ol>
