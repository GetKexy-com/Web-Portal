@if (navigateTo) {
  <li class="nav-item">
    <a
      [class.nav-dropdown]="isDropDown"
      [routerLink]="resolvedNavigateTo"
      routerLinkActive="active"
    >
      <i class="fa {{ icon }}" aria-hidden="true"></i> {{ label }}
    </a>
  </li>
}

@if (onClick) {
  <li class="nav-item" (click)="onNavItemClick()">
    <a [class.nav-dropdown]="isDropDown">
      <i class="fa {{ icon }}" aria-hidden="true"></i> {{ label }}
    </a>
  </li>
}
