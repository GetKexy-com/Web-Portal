<div class="canvas-content-wrap">
  <div class="head-area">
    <div class="head-text">
      <p class="head-title">{{ canvasTitle }} Lead Magnet</p>
      <span class="head-subtitle">A resource you offer to capture and nurture leads</span>
    </div>
    <button type="button" class="close-btn" aria-label="Close" (click)="activeCanvas.dismiss('Cross click')">
      <i class="fa fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <form class="canvas-form" [formGroup]="primaryForm" (ngSubmit)="handleSubmit()">
    <div class="canvas-body">
      <div class="form-section">
        <div class="section-head">
          <i class="fa fa-magnet section-icon" aria-hidden="true"></i>
          <span class="section-title">Lead magnet details</span>
        </div>

        <div class="fields-grid">
          <div class="field full">
            <label class="field-label">Title</label>
            <input class="form-control" formControlName="title" type="text"
                   placeholder="e.g. Ultimate Marketing Guide" />
            @if (formValidationErrorCheck('title')) {
              <error-message-card message="Title is missing or invalid!"></error-message-card>
            }
          </div>

          <div class="field full">
            <label class="field-label">Lead Magnet URL</label>
            <input class="form-control" formControlName="leadMagnetUrl" type="text"
                   placeholder="www.example.com/guide" />
            @if (formValidationErrorCheck('leadMagnetUrl') || invalidWebsite) {
              <error-message-card message="Url is missing or invalid!"></error-message-card>
            }
          </div>

          <div class="field full">
            <label class="field-label">Summary</label>
            <textarea class="form-control" formControlName="summary"
                      placeholder="Briefly describe what this lead magnet offers…"></textarea>
            @if (formValidationErrorCheck('summary')) {
              <error-message-card message="Summary is missing or invalid!"></error-message-card>
            }
          </div>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="blue-border-white-bg-button" type="button" (click)="activeCanvas.dismiss('Cross click')">
        Cancel
      </button>
      <button class="blue-button" type="submit" [disabled]="isLoading">
        @if (isLoading) {
          <i class="fa fa-spinner fa-spin me-2" aria-hidden="true"></i>
        }
        Save
      </button>
    </div>
  </form>
</div>
