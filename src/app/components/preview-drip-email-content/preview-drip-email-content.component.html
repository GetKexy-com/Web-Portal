<div class="canvas-content-wrap">
  <div class="head-area">
    <div class="head-text">
      <p class="head-title">Preview Email</p>
      <span class="head-subtitle">How this email will look in the recipient's inbox</span>
    </div>
    <div class="head-actions">
      <app-kexy-button
        label="Spin Another Version"
        iconLeft="fa-refresh"
        bgColor="#ffffff"
        textColor="#095dd1"
        borderColor="#e2e8f0"
        radius="10px"
        (click)="spinEmail()"
      ></app-kexy-button>
      <!--Spin is a content action, Close dismisses the drawer — the rule keeps
          them from reading as one cluster.-->
      <span class="head-divider" aria-hidden="true"></span>
      <button type="button" class="close-btn" aria-label="Close" (click)="activeCanvas.dismiss('Cross click')">
        <i class="fa fa-times" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <!-- Gmail-style "open email" reading pane — header chrome only, then the
       rendered email body in the iframe below.
       DO NOT restyle this block to the drawer's design tokens: it deliberately
       wears a mail client's palette because its job is to look like a real inbox,
       not like the rest of the portal. -->
  <div class="reading-pane">
    <div class="mail-subject-row">
      <h1 class="mail-subject">{{ emailSubject || '(no subject)' }}</h1>
      <span class="mail-label">Inbox</span>
    </div>

    <div class="mail-meta-row">
      <div class="avatar" [style.background]="avatarColor">{{ senderInitials }}</div>

      <div class="sender-meta">
        <div class="sender-line">
          <span class="sender-name">{{ senderName }}</span>
          <span class="sender-email">&lt;{{ senderEmail }}&gt;</span>
        </div>
        <div class="to-line">
          to me <i class="fa fa-caret-down"></i>
        </div>
      </div>

      <div class="mail-actions">
        <span class="mail-date">{{ sentDate | date: 'MMM d, y, h:mm a' }}</span>
        <i class="fa fa-star-o" title="Star"></i>
        <i class="fa fa-reply" title="Reply"></i>
        <i class="fa fa-ellipsis-v" title="More"></i>
      </div>
    </div>

    <!-- The iframe is filled by the component via `srcdoc` and is found through
         the `#previewFrame` @ViewChild — keep BOTH the element and the ref name. -->
    <div class="preview-stage">
      <iframe #previewFrame title="Email preview"></iframe>
    </div>
  </div>
</div>
