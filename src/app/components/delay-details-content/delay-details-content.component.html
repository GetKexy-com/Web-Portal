<div class="canvas-content-wrap">
  <div class="head-area">
    <div class="head-text">
      <p class="head-title">Delay Details</p>
      <span class="head-subtitle">Create a delay between actions.</span>
    </div>
    <button type="button" class="close-btn" aria-label="Close" (click)="activeCanvas.dismiss('Cross click')">
      <i class="fa fa-times" aria-hidden="true"></i>
    </button>
  </div>

  <form class="canvas-form" (ngSubmit)="handleSubmit()">
    <div class="canvas-body">

      <!--Wait time-->
      <div class="form-section">
        <div class="section-head">
          <i class="fa fa-clock-o section-icon" aria-hidden="true"></i>
          <span class="section-title">Wait time</span>
        </div>

        <p class="section-note">
          Choose how long the contact should wait before moving to the next action.
        </p>

        <div class="fields-grid">
          <div class="field">
            <label class="field-label" for="delayDays">Days</label>
            <input
              id="delayDays"
              type="number"
              name="delayDays"
              class="form-control"
              min="0"
              [(ngModel)]="delay.days"
              (change)="onDelayDaysChange()"
            />
          </div>
          <div class="field">
            <label class="field-label" for="delayHours">Hours</label>
            <input
              id="delayHours"
              type="number"
              name="delayHours"
              class="form-control"
              min="0"
              max="24"
              [(ngModel)]="delay.hours"
              (change)="onDelayHoursChange()"
            />
          </div>
          <div class="field">
            <label class="field-label" for="delayMinutes">Minutes</label>
            <input
              id="delayMinutes"
              type="number"
              name="delayMinutes"
              class="form-control"
              min="0"
              max="60"
              [(ngModel)]="delay.minutes"
              (change)="onDelayMinuteChange()"
            />
          </div>
        </div>

        <p class="field-hint">Hours are capped at 24 and minutes at 60. The delay can't be all zeros.</p>

        <div class="section-error" *ngIf="submitted && delay.days === 0 && delay.hours === 0 && delay.minutes === 0">
          <error-message-card message="Please enter a valid delay time."></error-message-card>
        </div>
      </div>
    </div>

    <div class="buttons">
      <button class="blue-border-white-bg-button" type="button" (click)="activeCanvas.dismiss('Cross click')">
        Cancel
      </button>
      <button class="blue-button" type="submit">
        <i *ngIf="isLoading" class="fa fa-spinner fa-spin me-2" aria-hidden="true"></i>
        Save
      </button>
    </div>
  </form>
</div>
