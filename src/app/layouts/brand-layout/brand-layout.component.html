<div id="page-container">
  <!-- Backdrop: only when the rail is expanded as an overlay on small screens -->
  <div
    *ngIf="isMobileScreen && !sidebarCollapsed"
    class="sidebar-backdrop"
    (click)="toggleSidebar()"
  ></div>

  <!-- Sidebar (collapses to an icon rail; default collapsed on small screens) -->
  <ul
    class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion"
    id="main-sidebar"
    [class.collapsed]="sidebarCollapsed"
  >
    <app-org-info></app-org-info>

    <nav-item-dropdown icon="fa-building-o" [label]="constants.COMPANY_DETAILS" [expand]="expandCompanyDetailsDropdown" [collapsed]="railCollapsed">
      <nav-item
        icon="fa-building-o"
        [isDropDown]="true"
        [navigateTo]="brand.PROMOTION_COMPANY_DESC"
        label="Company Desc."
      ></nav-item>
      <nav-item
        [isDropDown]="true"
        icon="fa-search"
        [navigateTo]="brand.PROMOTION_PRODUCT_DESC"
        label="Product/Service Desc."
      ></nav-item>
    </nav-item-dropdown>

    <nav-item-dropdown icon="fa-users" [label]="constants.CONTACTS" [expand]="expandContactsDropdown" [collapsed]="railCollapsed">
      <nav-item
        [isDropDown]="true"
        icon="fa-list"
        [navigateTo]="brand.MANAGE_LIST"
        label="Manage Lists"
      ></nav-item>
      <nav-item
        [isDropDown]="true"
        icon="fa-bars"
        [navigateTo]="brand.MANAGE_CONTACTS"
        label="Manage Contacts"
      ></nav-item>
      <nav-item
        [isDropDown]="true"
        icon="fa-search"
        [navigateTo]="brand.FIND_LEADS"
        label="Find Leads"
      ></nav-item>
    </nav-item-dropdown>

    <nav-item
      [isDropDown]="false"
      icon="fa-magnet"
      [navigateTo]="brand.LEAD_MAGNETS"
      label="Lead Magnets"
    ></nav-item>

    <nav-item-dropdown icon="fa-bullhorn" [label]="constants.DRIP_CAMPAIGN"
                       [expand]="expandDripCampaignDropdown" [collapsed]="railCollapsed">
      <nav-item
        [isDropDown]="true"
        icon="fa-plus"
        [navigateTo]="brand.CREATE_DRIP_CAMPAIGN"
        label="Create Campaign"
      ></nav-item>
<!--      <nav-item-->
<!--        [isDropDown]="true"-->
<!--        icon="fa-rocket"-->
<!--        [navigateTo]="brand.LAUNCH_DRIP_CAMPAIGN"-->
<!--        label="Launch Campaign"-->
<!--      ></nav-item>-->
      <nav-item
        [isDropDown]="true"
        icon="fa-bars"
        [navigateTo]="brand.LIST_DRIP_CAMPAIGN"
        label="Manage Campaigns"
      ></nav-item>
    </nav-item-dropdown>

    <nav-item-dropdown icon="fa-envelope-open-o" label="Messages" [expand]="expandProspectingDropdown" [collapsed]="railCollapsed">
      <nav-item
        [isDropDown]="true"
        icon="fa-inbox"
        [navigateTo]="brand.PROSPECTING_CONV_ALL"
        label="Inbox"
      ></nav-item>
      <nav-item
        [isDropDown]="true"
        icon="fa-paper-plane-o"
        [navigateTo]="brand.PROSPECTING_SENT_CONV"
        label="Sent"
      ></nav-item>
    </nav-item-dropdown>

<!--    <nav-item-dropdown icon="fa-bullhorn" [label]="constants.LANDING_PAGE + 's'" [expand]="expandPromotionDropdown">-->
<!--      <nav-item [isDropDown]="true" icon="fa-plus" [navigateTo]="brand.LANDING_PAGES"-->
<!--                [label]="'Create ' + constants.LANDING_PAGE"></nav-item>-->
<!--      <nav-item-->
<!--        [isDropDown]="true"-->
<!--        icon="fa-bars"-->
<!--        [navigateTo]="brand.LIST_PROMOTION"-->
<!--        [label]="'Manage ' + constants.LANDING_PAGE + 's'"-->
<!--      ></nav-item>-->
<!--    </nav-item-dropdown>-->

    <nav-item-dropdown icon="fa-cog" label="Settings" [expand]="expandSettingsDropdown" [collapsed]="railCollapsed">
      <nav-item
        icon="fa-briefcase"
        [isDropDown]="true"
        [navigateTo]="brand.INVITE_PEOPLE"
        label="Invite Users"
      ></nav-item>
      <nav-item
        icon="fa-slack"
        [isDropDown]="true"
        [navigateTo]="brand.SLACK_INTEGRATION"
        label="Slack Integration"
      ></nav-item>
      <nav-item
        icon="fa-envelope-o"
        [isDropDown]="true"
        [navigateTo]="brand.SMTP_SETTINGS"
        label="SMTP Settings"
      ></nav-item>
      <nav-item
        icon="fa-list"
        [isDropDown]="true"
        [navigateTo]="brand.SUPPRESSION_LIST"
        label="Suppression List"
      ></nav-item>
      <nav-item
        icon="fa-ban"
        [isDropDown]="true"
        [navigateTo]="brand.NEGATIVE_PROMPTS"
        label="Negative Prompts"
      ></nav-item>
    </nav-item-dropdown>

    <nav-item
      [isDropDown]="false"
      icon="fa-leanpub"
      [onClick]="tutorialsNavItemClicked"
      label="Tutorials"
    ></nav-item>

    <!-- Customer support pinned to the bottom (account menu lives top-right) -->
    <li class="sidebar-footer">
      <button class="kx-support-nav" (click)="support()" title="Contact customer support" [attr.data-label]="'Help & support'">
        <span class="kx-support-nav-ic"><i class="fa fa-headphones" aria-hidden="true"></i></span>
        <span class="kx-support-nav-text">
          <span class="kx-support-nav-title">Help &amp; support</span>
          <span class="kx-support-nav-sub">We're here to help</span>
        </span>
      </button>
    </li>
  </ul>

  <!-- End of Sidebar -->

  <!-- FOH Model popup starts-->
  <ng-template #tutorialVideoDialog let-c="close" let-d="dismiss">
    <modal [modalClose]="c">
      <div class="modal-body" style="padding: 0">
        <iframe
          allowfullscreen="true"
          autoplay
          frameborder="0"
          src="https://embed.fleeq.io/l/y5pamfiya2-34egqcq29j"
          style="width: 100%; height: 600px"
        ></iframe>
      </div>
    </modal>
  </ng-template>

  <div id="content-wrapper" class="flex-column d-flex" [style.background-color]="mainBgColor">
    <!-- header starts -->
    <div class="flash-div">
      <div class="row justify-content-center">
        <!--        TODO-->
        <!--        <flash-messages></flash-messages>-->
      </div>
    </div>

    <header id="main-header" [class]="headerBgWhite ? 'main-warp white-bg' : 'main-warp'">
      <div class="row justify-content-between">
        <div class="col d-flex align-items-center">
          <!-- Sidebar toggle (panel-left glyph, like modern apps) -->
          <a
            (click)="toggleSidebar()"
            class="hideSidebarArrow"
            role="button"
            [attr.aria-label]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
            [attr.aria-expanded]="!sidebarCollapsed"
            [attr.title]="sidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
          >
            <svg
              class="panel-toggle-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <path d="M9 3v18" />
            </svg>
          </a>
          <app-back-button *ngIf="showBackButton"></app-back-button>
          <span style="font-size: 14px; font-weight: bold">{{ headline }}</span>
        </div>

        <div class="col">
          <div class="modify-content text-end">
            <div ngbDropdown class="d-inline-block kx-user-dropdown" placement="bottom-end">
              <button class="kx-user-pill" id="dropdownBasic1" ngbDropdownToggle>
                <span class="kx-avatar">
                  <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" alt="" />
                  <ng-container *ngIf="!userAvatarUrl">{{ userInitials }}</ng-container>
                </span>
                <span class="kx-user-meta">
                  <span class="kx-user-fullname">{{ username }}</span>
                  <span class="kx-user-role" *ngIf="userRole">{{ userRole }}</span>
                </span>
                <i class="fa fa-angle-down kx-caret" aria-hidden="true"></i>
              </button>
              <div ngbDropdownMenu aria-labelledby="dropdownBasic1" class="kx-dropdown-menu">
                <div class="kx-dd-header">
                  <span class="kx-avatar kx-avatar-lg">
                    <img *ngIf="userAvatarUrl" [src]="userAvatarUrl" alt="" />
                    <ng-container *ngIf="!userAvatarUrl">{{ userInitials }}</ng-container>
                  </span>
                  <div class="kx-dd-identity">
                    <div class="kx-dd-name">{{ username }}</div>
                    <div class="kx-dd-email" *ngIf="userEmail">{{ userEmail }}</div>
                    <span class="kx-dd-role" *ngIf="userRole">{{ userRole }}</span>
                  </div>
                </div>

                <div class="kx-dd-group">
                  <button ngbDropdownItem (click)="editProfileTapped()">
                    <span class="kx-dd-ic"><i class="fa fa-user" aria-hidden="true"></i></span>
                    <span>Edit Profile</span>
                  </button>
                  <button *ngIf="isAdmin" ngbDropdownItem (click)="editCompanyTapped()">
                    <span class="kx-dd-ic"><i class="fa fa-pencil-square-o" aria-hidden="true"></i></span>
                    <span>Edit Company</span>
                  </button>
                  <button ngbDropdownItem (click)="subscriptionsTapped()">
                    <span class="kx-dd-ic"><i class="fa fa-credit-card" aria-hidden="true"></i></span>
                    <span>Subscriptions</span>
                  </button>
                  <button ngbDropdownItem (click)="support()">
                    <span class="kx-dd-ic"><i class="fa fa-headphones" aria-hidden="true"></i></span>
                    <span>Support</span>
                  </button>
                </div>

                <div class="kx-dd-divider"></div>

                <button ngbDropdownItem class="kx-dd-logout" (click)="handleLogout()">
                  <span class="kx-dd-ic"><i class="fa fa-sign-out" aria-hidden="true"></i></span>
                  <span>Logout</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="text-center" *ngIf="isUploadingCsvFlag">
        <div class="spinner-border" role="status">
          <span class="sr-only">Loading...</span>
        </div>
      </div>
    </header>

    <!-- header ends -->
    <div [id]="fullPageScroll ? 'main-content' : ''" [class]="layoutPaddingNone ? '' : 'main-warp'">
      <ng-content></ng-content>
    </div>
  </div>

  <ng-template #subscriptionModal let-c="close" let-d="dismiss">
    <brand-subscription-modal [closeModal]="c" [userData]="userData"></brand-subscription-modal>
  </ng-template>

  <ng-template #tutorialModal let-c="close" let-d="dismiss">
    <p>hello world</p>
  </ng-template>
  <!-- content-wrapper ends -->
</div>
