<div id="page-container" class="auth-shell">
  <!-- Brand panel (desktop / tablet) -->
  <aside class="brand-panel desktop-view" [class.brand-panel--compact]="compactBrandPanel">
    <span class="brand-grid" aria-hidden="true"></span>
    <span class="brand-blob brand-blob--1" aria-hidden="true"></span>
    <span class="brand-blob brand-blob--2" aria-hidden="true"></span>
    <span class="brand-blob brand-blob--3" aria-hidden="true"></span>

    <div class="brand-content">
      <div class="brand-logo-glow">
        <img class="brand-logo" src="/assets/images/kexy-white-logo.png" alt="KEXY" />
      </div>
    </div>
  </aside>

  <!-- Brand header (mobile) -->
  <div class="brand-panel-mobile mobile-tablet-view">
    <span class="brand-blob brand-blob--1" aria-hidden="true"></span>
    <span class="brand-blob brand-blob--2" aria-hidden="true"></span>
    <img class="brand-logo" src="/assets/images/kexy-white-logo.png" alt="KEXY" />
  </div>

  <div
    id="content-wrapper"
    class="flex-column d-flex"
    [style.justify-content]="isContentCentered ? 'center' : 'start'"
    [style.background-color]="bgColor"
  >
    <div
      id="main-content"
      [class]="layoutPaddingNone ? 'scrollable-full-page' : 'main-warp kx-custom-box-login-signup'"
    >
      <ng-content></ng-content>
    </div>
  </div>
</div>
<!--- #page-container ends -->
