<brand-layout layoutPaddingNone="true" headerBgWhite="true" mainBgColor="#f4f6fb">
  <div class="brand-list-of-drip-campaign-page">
    <div class="top-btns">
      <div class="d-flex">

        @if (selectedDripCampaigns().length) {
          <app-kexy-button
            (click)="deleteDripCampaigns()"
            style="margin-right: 10px"
            label="Delete"
            iconLeft="fa-trash"
            bgColor="#e7f6fe"
            textColor="#2847cc"
            radius="8px"
          />
        }

        @if (selectedDripCampaigns().length === 1) {
          <app-kexy-button
            (click)="redirectToEditPage(true)"
            style="margin-right: 10px"
            label="Duplicate"
            iconLeft="fa-pencil-square-o"
            bgColor="#e7f6fe"
            textColor="#2847cc"
            radius="8px"
          />

          <app-kexy-button
            (click)="redirectToEditPage()"
            style="margin-right: 10px"
            label="Edit"
            iconLeft="fa-pencil-square-o"
            bgColor="#e7f6fe"
            textColor="#2847cc"
            radius="8px"
          />
        }

        @if (selectedDripCampaigns().length === 1 &&
        (selectedDripCampaigns()[0]?.status === constants.ACTIVE ||
          selectedDripCampaigns()[0]?.status === constants.PAUSE)) {
          <app-kexy-button
            (click)="pauseOrResumeOrDeleteDripCampaign()"
            style="margin-right: 10px"
            [label]="setBtnLabelBasedOnCampaignStatus()"
            [iconLeft]="setBtnIconBasedOnCampaignStatus()"
            bgColor="#e7f6fe"
            textColor="#2847cc"
            radius="8px"
          />
        }

        <!--LAST, so it sits at the far right of this right-aligned bar and keeps the
            same position whatever is selected: the buttons above are contextual and
            push in from the left as they appear. Without it the bar is empty until
            something is ticked, which left the page's primary action reachable only
            from the sidebar.

            "New Campaign", not "Create Campaign": the + icon already carries the verb,
            and this is the label the destination then repeats as its breadcrumb leaf
            (`Manage Campaigns › New Campaign`). The sidebar item keeps the longer
            "Create Campaign" — it names a task in a list of destinations, where a bare
            "New Campaign" reads oddly.-->
        <app-kexy-button
          (click)="redirectToCreatePage()"
          label="New Campaign"
          iconLeft="fa-plus"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        />
      </div>
    </div>

    <div class="content-area">
      <list-of-drip-campaign-table
        tableHeaderBg="#f1f5f9"
        tableHeaderColor="#475569"
        [checkboxClicked]="handleContactSelect"
        [cardData]="dripCampaignList()"
        [dripCampaignTitles]="dripCampaignTitles()"
        [selectedDripCampaigns]="selectedDripCampaigns()"
        [totalRecordsCount]="totalRecordsCount()"
        [totalPage]="totalPageCounts()"
        [currentPage]="page()"
        [limit]="limit()"
        (selectedLimit)="receivedLimitNumber($event)"
        (selectedStatus)="receivedDripStatusFilter($event)"
        [paginationLeftArrowClick]="paginationLeftArrowClick"
        [paginationRightArrowClick]="paginationRightArrowClick"
        [paginationFirstClick]="paginationFirstClick"
        [paginationLastClick]="paginationLastClick"
        [navigateSpecificPage]="navigateToPage"
        [isWaitingFlag]="isWaitingFlag()"
        [isLoading]="isLoading()"
        [selectedAllDripCampaigns]="selectedAllDripCampaigns()"
        [toggleSelectAllSelection]="toggleSelectAllSelection"
      />
    </div>
  </div>
</brand-layout>
