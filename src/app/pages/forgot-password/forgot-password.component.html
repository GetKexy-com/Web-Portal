<login-layout>
  <div class="row">
    <div class="login-container">
      <div class="login-wrapper">
        <div class="login-left">
          <h4>Forgot Password</h4>
          <p class="auth-subtitle">Enter your email and we'll send you a code to reset your password</p>

          <div class="login-form">
            <p *ngIf="error" class="text-danger form-error">{{ error }}</p>
            <form [formGroup]="forgetPasswordForm" (ngSubmit)="onSubmit()">
              <!-- Email -->
              <div class="form-group">
                <div class="input-icon-wrap">
                  <i class="fa fa-envelope-o input-lead-icon" aria-hidden="true"></i>
                  <input
                    [class.error]="email.invalid && (email.dirty || email['touched'])"
                    type="email"
                    formControlName="email"
                    class="login-control"
                    placeholder="Email Address"
                  />
                </div>
                <div *ngIf="email.invalid && (email.dirty || email['touched'])">
                  <p *ngIf="email.errors['required']" class="text-danger">Email is required</p>
                  <p *ngIf="email.errors['email']" class="text-danger my-0">Email is invalid</p>
                </div>
              </div>

              <div class="form-group">
                <button
                  class="kx-create-btn"
                  type="submit"
                  [disabled]="!forgetPasswordForm.valid"
                  name="submit"
                  id="submit"
                >
                  <i *ngIf="isWaitingFlag" class="fa fa-spinner fa-spin" aria-hidden="true"></i>
                  Confirm
                </button>
              </div>

              <p class="auth-footer-text">
                Remember your password?
                <a routerLink="/login">Back to login</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</login-layout>
