<brand-layout layoutPaddingNone="true" headerBgWhite="true" [fullPageScroll]="false">
  <div class="brand-contacts-page">
    <div class="top-btns">
      <!--Buttons for large screen-->
      <div class="buttons-for-large-screen">
        <app-kexy-button
          *ngIf="selectedContacts.length"
          [disabled]="isWaitingFlag || isLoading || selectAllContacts"
          (click)="handleAddToDripCampaign()"
          style="margin-right: 10px"
          label="Add To Drip Campaign"
          iconLeft="fa-plus"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="selectedContacts.length && !addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading"
          (click)="deleteContacts()"
          style="margin-right: 10px"
          label=""
          iconLeft="fa-trash"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="!selectedContacts.length"
          (click)="handleSearchBtnClick()"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label="Filter"
          iconLeft="fa-search"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="!addToDripCampaignId && !selectedContacts.length"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label="Add Contact"
          iconLeft="fa-plus"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          (click)="addContactClick()"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="selectedContacts.length && !addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label="Edit Contact(s)"
          iconLeft="fa-pencil"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          (click)="editContactClick()"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="selectedContacts.length && !addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading || selectAllContacts || contactCard.validationLoading || contactCard.isValidationProgress()"
          (click)="contactCard.validateList()"
          style="margin-right: 10px"
          [label]="contactCard.validationLoading ? 'Please wait...' : 'Validate Emails (' + selectedContacts.length + ')'"
          [iconLeft]="contactCard.validationLoading ? 'fa-refresh fa-spin' : 'fa-check-circle-o'"
          tooltip="Validate emails for the selected contact(s)"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="!addToDripCampaignId && !selectedContacts.length"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label="Import"
          iconLeft="fa-cloud-upload"
          (click)="importBtnClick(uploadContacts)"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="!addToDripCampaignId && !selectedContacts.length"
          (click)="exportCSV()"
          [disabled]="exportBtnLoading || isLoading || isWaitingFlag"
          [label]="exportBtnLoading ? 'Please wait...' : 'Export' "
          [iconLeft]="exportBtnLoading ? 'fa-refresh fa-spin' : 'fa-cloud-download'"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>
      </div>

      <!--Buttons for small laptop screen-->
      <div class="buttons-for-small-screen">
        <app-kexy-button
          *ngIf="selectedContacts.length && !addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading"
          (click)="deleteContacts()"
          style="margin-right: 10px"
          label=""
          iconLeft="fa-trash"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          tooltip="Delete Contact(s)"
        ></app-kexy-button>

        <app-kexy-button
          (click)="handleSearchBtnClick()"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label=""
          iconLeft="fa-search"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          tooltip="Filter Contact(s)"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="!addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label=""
          iconLeft="fa-plus"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          (click)="addContactClick()"
          tooltip="Add Contact"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="selectedContacts.length && !addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label=""
          iconLeft="fa-pencil"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          (click)="editContactClick()"
          tooltip="Edit Contact(s)"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="selectedContacts.length && !addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading || selectAllContacts || contactCard.validationLoading || contactCard.isValidationProgress()"
          (click)="contactCard.validateList()"
          style="margin-right: 10px"
          label=""
          [iconLeft]="contactCard.validationLoading ? 'fa-refresh fa-spin' : 'fa-check-circle-o'"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          tooltip="Validate Emails"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="!addToDripCampaignId"
          [disabled]="isWaitingFlag || isLoading"
          style="margin-right: 10px"
          label=""
          iconLeft="fa-cloud-upload"
          (click)="importBtnClick(uploadContacts)"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          tooltip="Import Contact(s)"
        ></app-kexy-button>

        <app-kexy-button
          *ngIf="!addToDripCampaignId"
          (click)="exportCSV()"
          [disabled]="exportBtnLoading || isWaitingFlag || isLoading"
          [label]="exportBtnLoading ? 'Please wait...' : '' "
          [iconLeft]="exportBtnLoading ? 'fa-refresh fa-spin' : 'fa-cloud-download'"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
          tooltip="Export Csv"
        ></app-kexy-button>
      </div>
    </div>

    <div class="content-area">
      <div class="active-filters" *ngIf="activeFilterCount">
        <span class="af-label"><i class="fa fa-filter" aria-hidden="true"></i> Filters</span>
        <span class="filter-chip" *ngFor="let chip of getActiveFilterChips()">
          <span class="chip-key">{{ chip.label }}:</span>
          <span class="chip-val">{{ chip.value }}</span>
          <button type="button" class="chip-remove" (click)="removeFilter(chip.key)"
                  [attr.aria-label]="'Remove ' + chip.label + ' filter'">
            <i class="fa fa-times" aria-hidden="true"></i>
          </button>
        </span>
        <button type="button" class="clear-filter" (click)="resetSearchData()">Clear all</button>
      </div>

      <contact-list-card
        #contactCard
        tableHeaderBg="#f1f5f9"
        tableHeaderColor="#475569"
        [searchLabels]="searchLabels"
        [searchContactName]="searchContactName"
        [searchContactCity]="searchContactCity"
        [searchContactCountry]="searchContactCountry"
        [searchContactState]="searchContactState"
        [searchContactEmailStatus]="searchContactEmailStatus"
        [searchContactMarketingStatus]="searchContactMarketingStatus"
        [resetSearchData]="resetSearchData"
        [checkboxClicked]="handleContactSelect"
        [editContact]="editContactClick"
        [contacts]="contactList"
        [totalPage]="totalPage"
        [totalContactsCount]="totalContactsCount"
        [currentPage]="page"
        [limit]="limit"
        (selectedLimit)="receivedLimitNumber($event)"
        (refreshContacts)="getContacts(true)"
        (importCompleted)="handleImportCompleted($event)"
        [paginationLeftArrowClick]="paginationLeftArrowClick"
        [paginationRightArrowClick]="paginationRightArrowClick"
        [navigateSpecificPage]="navigateSpecificPage"
        [sortByCreatedAt]="handleSortByCreatedAt"
        [activeFilterClick]="handleSearchBtnClick"
        [activeFilterCount]="activeFilterCount"
        [isWaitingFlag]="isWaitingFlag"
        [isLoading]="isLoading"
        [selectAllContacts]="selectAllContacts"
        [toggleSelectAllContactSelection]="toggleSelectAllContactSelection"
      ></contact-list-card>
    </div>
  </div>
  <ng-template #uploadContacts let-c="close" let-d="dismiss">
    <upload-file-modal-content
      [closeModal]="closeModal"
      [isLoading]="isLoading"
      [bypassEmailVerification]="handleBypassEmailVerification"
      [showListsDropdown]="true"
      (parsedFileData)="showImportPreview($event)"
      (selectedLists)="getSelectedLabels($event)"
      sampleCsvUrl="/assets/contact-list-sample.csv"
      additionalFileRelatedText="KEXY ensures data integrity by cleaning and validating every imported list. We charge 1 credit for every 100 contacts. For instance, importing a list of 1,000 contacts will deduct 10 credits from your account."
    >
    </upload-file-modal-content>
  </ng-template>
  <ng-template #searchContacts let-c="close" let-d="dismiss">
    <search-contact-modal-content
      [closeModal]="closeSearchModal"
      [searchContactClick]="searchContactClickHandle"
    >
    </search-contact-modal-content>
  </ng-template>
</brand-layout>
