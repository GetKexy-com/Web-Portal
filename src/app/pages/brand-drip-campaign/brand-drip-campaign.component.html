<brand-layout layoutPaddingNone="true" headerBgWhite="true" [breadcrumbs]="breadcrumbs">
  <div class="brand-drip-campaign-page">
    <div class="progress-wrap">
      <progress-count [currentStep]="currentStep" [steps]="steps"></progress-count>
    </div>
    <div class="page-content">
      <!--Layout-shaped skeleton rather than a floating "Please wait" box. While a
          campaign loads, `currentStep` is null so NO step content renders — this is
          the only thing on screen, so it should preview the shape that is coming
          instead of hovering over an empty page.-->
      <div *ngIf="isWaitingFlag" class="page-loading">
        <div class="sk-card">
          <div class="sk-card-head">
            <span class="sk sk-line lg"></span>
            <div class="sk-actions">
              <span class="sk sk-btn"></span>
              <span class="sk sk-btn"></span>
              <span class="sk sk-btn"></span>
            </div>
          </div>
          <div class="sk-card-band">
            <span class="sk sk-field"></span>
            <span class="sk sk-field"></span>
            <span class="sk sk-field"></span>
          </div>
        </div>

        <div class="sk-card sk-body">
          <span class="sk sk-line md"></span>
          <span class="sk sk-block"></span>
        </div>

        <p class="loading-note">
          <i class="fa fa-spinner fa-spin" aria-hidden="true"></i>
          Loading your campaign…
        </p>
      </div>

      <div class="content">
        <div *ngIf="currentStep === 1">
          <drip-campaign-content [nextBtnClick]="nextBtnClick" [backBtnClick]="backBtnClick" />
        </div>
        <div *ngIf="currentStep === 2">
          <generate-drip-campaign [nextBtnClick]="nextBtnClick" [backBtnClick]="backBtnClick" />
        </div>
      </div>
    </div>
  </div>

  <ng-template #dripCampaignInitialModal let-c="close" let-d="dismiss">
    <kexy-pro-tips-modal-content
      [closeModal]="c"
      [features]="features"
      titlePart1="How to Create a Drip Campaign"
      [bookCallBtnShow]="true"
      [from]="routeConstants.BRAND.CREATE_DRIP_CAMPAIGN"
      audioPlayBtnText="Product demo video"
      aurdioUrl=""
      audioPlayBtnIconLeft="fa-play"
      [audioOrTutorialBtnClick]="handleTutorialBtnClick"
    ></kexy-pro-tips-modal-content>
  </ng-template>
</brand-layout>
