<brand-layout layoutPaddingNone="true" headerBgWhite="true">
  <main class="brand-list-contacts-page">
    <section class="card-area-wrap">
      <prospecting-common-card
        cardTitle="Company Details"
        cardDetails="You can view or update your company/business information here"
        cardTitleLogo="/assets/icon/user.svg"
      >
      </prospecting-common-card>
    </section>

    <section class="profile-grid">
      <!-- ── Left: company summary card ── -->
      <aside class="profile-sidebar">
        <div class="avatar-wrap">
          <img *ngIf="imageUrl" class="avatar" [src]="imageUrl" alt="Company logo" />
          <div *ngIf="!imageUrl" class="avatar avatar-initials">
            {{ (userData?.supplier_name || 'C').charAt(0) }}
          </div>
          <button type="button" class="avatar-edit" title="Upload logo" (click)="openFileDialog()">
            <i class="fa fa-camera" aria-hidden="true"></i>
          </button>
          <input type="file" name="" class="profile-photo-file-input tr-hidden" (change)="fileSelected($event)" />
        </div>

        <h3 class="profile-name">{{ userData?.supplier_name }}</h3>
        <span class="role-badge">Business</span>

        <button type="button" class="photo-link" (click)="openFileDialog()">
          <i class="fa fa-upload" aria-hidden="true"></i> Upload new logo
        </button>
      </aside>

      <!-- ── Right: editable company details ── -->
      <div class="form-panel">
        <header class="panel-head">
          <h2 class="panel-title">Company Information</h2>
          <p class="panel-subtitle">Update your business name, location and contact details.</p>
        </header>

        <form [formGroup]="primaryForm" (ngSubmit)="primaryFormSubmitted()">
          <div class="field-grid">
            <div class="field">
              <label class="field-label">Company Name</label>
              <input
                [class.error]="(submitted || primaryForm.controls['name'].dirty) && primaryForm.controls['name'].invalid"
                type="text"
                formControlName="name"
                class="form-control"
                placeholder="Company Name"
              />
              <div *ngIf="primaryForm.controls['name'].invalid && (submitted || primaryForm.controls['name'].dirty)">
                <error-message-card message="Please enter a valid Company Name."></error-message-card>
              </div>
            </div>

            <div class="field">
              <label class="field-label">City</label>
              <input
                [class.error]="(submitted || primaryForm.controls['city'].dirty) && primaryForm.controls['city'].invalid"
                type="text"
                formControlName="city"
                class="form-control"
                placeholder="City"
              />
              <div *ngIf="primaryForm.controls['city'].invalid && (submitted || primaryForm.controls['city'].dirty)">
                <error-message-card message="Please enter a valid City name."></error-message-card>
              </div>
            </div>

            <div class="field">
              <label class="field-label">State</label>
              <select
                [class.error]="(submitted || primaryForm.controls['state'].dirty) && primaryForm.controls['state'].invalid"
                formControlName="state"
                class="form-control"
              >
                <option value="" selected>{{ stateLabel }}</option>
                <option *ngFor="let state of states" [value]="state.isoCode">
                  {{ state.name }}
                </option>
              </select>
            </div>

            <div class="field">
              <label class="field-label">Country</label>
              <select
                [class.error]="(submitted || primaryForm.controls['country'].dirty) && primaryForm.controls['country'].invalid"
                formControlName="country"
                class="form-control"
              >
                <option value="" selected>Please Select Country</option>
                <option *ngFor="let country of countries" [value]="country.isoCode">
                  {{ country.name }}
                </option>
              </select>
            </div>

            <div class="field">
              <label class="field-label">Zip Code</label>
              <input
                [class.error]="(submitted || primaryForm.controls['zip_code'].dirty) && primaryForm.controls['zip_code'].invalid"
                type="text"
                formControlName="zip_code"
                class="form-control"
                placeholder="{{ zipCodePlaceholder }}"
              />
              <div *ngIf="primaryForm.controls['zip_code'].invalid && (submitted || primaryForm.controls['zip_code'].dirty)">
                <error-message-card [message]="`${ zipCodePlaceholder } is invalid`"></error-message-card>
              </div>
            </div>

            <div class="field">
              <label class="field-label">Mobile Number</label>
              <div class="phonefields">
                <input
                  [class.error]="(submitted || primaryForm.controls['phone'].dirty) && primaryForm.controls['phone'].invalid"
                  class="form-control phoneNumber"
                  formControlName="phone"
                  appPhoneNumberMask
                  placeholder="Mobile Phone"
                  type="tel"
                />
              </div>
              <div *ngIf="(submitted || primaryForm.controls['phone'].dirty) && primaryForm.controls['phone'].errors?.['wrongNumber']">
                <error-message-card [message]="primaryForm.controls['phone'].errors?.['wrongNumber'].message"></error-message-card>
              </div>
            </div>

            <div class="field field--full">
              <label class="field-label">Website</label>
              <input
                [class.error]="(submitted || primaryForm.controls['website'].dirty) && primaryForm.controls['website'].invalid"
                type="text"
                formControlName="website"
                class="form-control"
                placeholder="Website"
              />
              <div *ngIf="primaryForm.controls['website'].invalid && (submitted || primaryForm.controls['website'].dirty)">
                <error-message-card message="Please enter a valid website."></error-message-card>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <app-kexy-button
              padding="10px 28px"
              type="submit"
              [label]="isWaitingFlag ? 'Please wait...' : 'Save Changes'"
              [disabled]="isWaitingFlag"
              [iconLeft]="isWaitingFlag ? 'fa-refresh fa-spin' : 'fa-save'"
            ></app-kexy-button>
          </div>
        </form>
      </div>
    </section>
  </main>
</brand-layout>
