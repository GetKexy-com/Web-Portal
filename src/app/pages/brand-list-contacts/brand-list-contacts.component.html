<!--Breadcrumbs instead of a bare "Contacts": this page is a child of Manage Lists, so
    the trail states where you are AND gives you the way back. No [showBackButton] —
    the "Manage Lists" crumb is that affordance, and both would be the same action twice.-->
<brand-layout
  layoutPaddingNone="true"
  headerBgWhite="true"
  [breadcrumbs]="breadcrumbs"
>
  <main class="brand-list-contacts-page">
    <section class="card-area-wrap">
      <prospecting-common-card
        [cardTitle]="listObj?.label"
        [listInfo]="listObj"
        cardTitleLogo="/assets/icon/blue-box-icon.svg"
      ></prospecting-common-card>
    </section>

    <!--This page has no toolbar of its own (the card owns its actions), so the
        snapshot controls get a slim row between the info card and the table. Must be
        flex-shrink: 0 — the section below it is the flex child that fills the
        remaining height and scrolls internally.-->
    <div class="snapshot-bar">
      <app-time-ago class="updated-stamp" [value]="lastUpdatedAt" />
      <button
        type="button"
        class="refresh-btn"
        (click)="refresh()"
        [disabled]="isRefreshing || isWaitingFlag || isLoading"
        title="Refresh contacts"
        aria-label="Refresh contacts"
      >
        <i class="fa" [class.fa-refresh]="true" [class.fa-spin]="isRefreshing" aria-hidden="true"></i>
      </button>
    </div>

    <section>
      <contact-list-card
        #contactCard
        tableHeaderBg="#f1f5f9"
        tableHeaderColor="#475569"
        [searchLabels]="[]"
        [listInfo]="listObj"
        [checkboxClicked]="handleContactSelect"
        [editContact]="editContactClick"
        [createContactClick]="createContactClick"
        [deleteContacts]="deleteContacts"
        [deleteContactsFromList]="deleteContactsFromList"
        [importBtnClick]="importBtnClick"
        [contacts]="contactList"
        [selectedContacts]="selectedContacts"
        [totalPage]="totalPage"
        [currentPage]="page"
        [limit]="limit"
        (selectedLimit)="receivedLimitNumber($event)"
        (refreshContacts)="getContacts(true)"
        (importCompleted)="handleImportCompleted($event)"
        [paginationLeftArrowClick]="paginationLeftArrowClick"
        [paginationRightArrowClick]="paginationRightArrowClick"
        [navigateSpecificPage]="navigateSpecificPage"
        [sortByCreatedAt]="handleSortByCreatedAt"
        [showBackBtn]="false"
        [showTitle]="false"
        [showActionBtns]="true"
        [backBtnClick]="backBtnClick"
        [isWaitingFlag]="isWaitingFlag"
        [isLoading]="isLoading"
        [totalContactsCount]="totalContactsCount"
        [selectAllContacts]="selectAllContacts"
        [toggleSelectAllContactSelection]="toggleSelectAllContactSelection"
      ></contact-list-card>
    </section>
  </main>
  <ng-template #uploadContacts let-c="close" let-d="dismiss">
    <upload-file-modal-content
      [closeModal]="closeModal"
      [isLoading]="isLoading"
      [bypassEmailVerification]="handleBypassEmailVerification"
      (parsedFileData)="showImportPreview($event)"
      sampleCsvUrl="/assets/contact-list-sample.csv"
      additionalFileRelatedText="KEXY ensures data integrity by cleaning and validating every imported list. We charge 1 credit for every 100 contacts. For instance, importing a list of 1,000 contacts will deduct 10 credits from your account."
    >
    </upload-file-modal-content>
  </ng-template>
</brand-layout>
