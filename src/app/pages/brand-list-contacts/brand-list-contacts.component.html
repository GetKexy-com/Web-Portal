<!--Breadcrumbs instead of a bare "Contacts": this page is a child of Manage Lists, so
    the trail states where you are AND gives you the way back. No [showBackButton] —
    the "Manage Lists" crumb is that affordance, and both would be the same action twice.-->
<brand-layout
  layoutPaddingNone="true"
  headerBgWhite="true"
  [breadcrumbs]="breadcrumbs"
>
  <main class="brand-list-contacts-page">
    <section class="card-area-wrap">
      <prospecting-common-card
        [cardTitle]="listObj?.label"
        [listInfo]="listObj"
        cardTitleLogo="/assets/icon/blue-box-icon.svg"
      ></prospecting-common-card>
    </section>

    <!--The card no longer owns any actions — they all live here, in one row, at every
        screen size: snapshot (last-updated + refresh) first/left, actions last/right.
        Wired to the same handlers the card's own row used to call; validate goes
        through #contactCard since that logic lives on the card.-->
    <div class="actions-bar">
      <div class="actions-bar-snapshot">
        <app-time-ago class="updated-stamp" [value]="lastUpdatedAt" />
        <button
          type="button"
          class="refresh-btn"
          (click)="refresh()"
          [disabled]="isRefreshing || isWaitingFlag || isLoading"
          title="Refresh contacts"
          aria-label="Refresh contacts"
        >
          <i class="fa" [class.fa-refresh]="true" [class.fa-spin]="isRefreshing" aria-hidden="true"></i>
        </button>
      </div>

      <div class="actions-bar-buttons">
        <app-kexy-button
          *ngIf="selectedContacts.length"
          (click)="deleteContacts()"
          [label]="'Delete (' + (selectAllContacts ? totalContactsCount : selectedContacts.length) + ')'"
          tooltip="This action permanently deletes your account and all associated data. This cannot be undone."
          iconLeft="fa-trash"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>
        <app-kexy-button
          *ngIf="selectedContacts.length"
          (click)="deleteContactsFromList()"
          [label]="'Remove From List (' + (selectAllContacts ? totalContactsCount : selectedContacts.length) + ')'"
          tooltip="Remove From List"
          iconLeft="fa-minus-circle"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>
        <app-kexy-button
          *ngIf="selectedContacts.length"
          (click)="editContactClick()"
          label="Edit Contact(s)"
          tooltip="Edit Contact(s)"
          iconLeft="fa-pencil"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>
        <app-kexy-button
          *ngIf="!selectedContacts.length"
          (click)="createContactClick()"
          label="Add Contact"
          tooltip="Add New Contact"
          iconLeft="fa-plus"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>
        <app-kexy-button
          *ngIf="contactList.length"
          (click)="contactCard.validateList()"
          [disabled]="contactCard.validationLoading || contactCard.isValidationProgress()"
          [label]="contactCard.validationLoading ? 'Please wait...' : (selectAllContacts ? 'Validate Emails (' + totalContactsCount + ')' : (selectedContacts.length ? 'Validate Emails (' + selectedContacts.length + ')' : 'Validate Emails'))"
          [iconLeft]="contactCard.validationLoading ? 'fa-refresh fa-spin' : 'fa-shield'"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>
        <app-kexy-button
          *ngIf="!selectedContacts.length"
          label="Import"
          iconLeft="fa-cloud-upload"
          (click)="importBtnClick()"
          tooltip="Import Contacts(s)"
          bgColor="#e7f6fe"
          textColor="#2847cc"
          radius="8px"
        ></app-kexy-button>
      </div>
    </div>

    <section>
      <contact-list-card
        #contactCard
        tableHeaderBg="#f1f5f9"
        tableHeaderColor="#475569"
        [searchLabels]="[]"
        [listInfo]="listObj"
        [checkboxClicked]="handleContactSelect"
        [editContact]="editContactClick"
        [createContactClick]="createContactClick"
        [deleteContacts]="deleteContacts"
        [deleteContactsFromList]="deleteContactsFromList"
        [importBtnClick]="importBtnClick"
        [contacts]="contactList"
        [selectedContacts]="selectedContacts"
        [totalPage]="totalPage"
        [currentPage]="page"
        [limit]="limit"
        (selectedLimit)="receivedLimitNumber($event)"
        (refreshContacts)="getContacts(true)"
        (importCompleted)="handleImportCompleted($event)"
        [paginationLeftArrowClick]="paginationLeftArrowClick"
        [paginationRightArrowClick]="paginationRightArrowClick"
        [navigateSpecificPage]="navigateSpecificPage"
        [sortByCreatedAt]="handleSortByCreatedAt"
        [showBackBtn]="false"
        [showTitle]="false"
        [backBtnClick]="backBtnClick"
        [isWaitingFlag]="isWaitingFlag"
        [isLoading]="isLoading"
        [totalContactsCount]="totalContactsCount"
        [selectAllContacts]="selectAllContacts"
        [toggleSelectAllContactSelection]="toggleSelectAllContactSelection"
      ></contact-list-card>
    </section>
  </main>
  <ng-template #uploadContacts let-c="close" let-d="dismiss">
    <upload-file-modal-content
      [closeModal]="closeModal"
      [isLoading]="isLoading"
      [bypassEmailVerification]="handleBypassEmailVerification"
      (parsedFileData)="showColumnMapping($event)"
      sampleCsvUrl="/assets/contact-list-sample.csv"
      additionalFileRelatedText="KEXY ensures data integrity by cleaning and validating every imported list. We charge 1 credit for every 100 contacts. For instance, importing a list of 1,000 contacts will deduct 10 credits from your account."
    >
    </upload-file-modal-content>
  </ng-template>
</brand-layout>
