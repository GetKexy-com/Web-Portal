<login-layout>
  <div class="row">
    <div class="login-container">
      <div class="login-wrapper">
        <div class="login-left">
          <h4>Reset Password</h4>
          <p class="auth-subtitle">Enter the 6-digit code sent to your email and choose a new password</p>

          <div class="login-form">
            <p *ngIf="error" class="text-danger form-error">{{ error }}</p>
            <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
              <!-- Email (readonly) -->
              <div class="form-group">
                <label class="input-label-text">Email Address</label>
                <div class="input-icon-wrap">
                  <i class="fa fa-envelope-o input-lead-icon" aria-hidden="true"></i>
                  <input
                    type="email"
                    formControlName="email"
                    readonly
                    class="login-control"
                    [(ngModel)]="email"
                    placeholder="Email Address"
                  />
                </div>
              </div>

              <!-- Recovery code -->
              <div class="form-group">
                <label class="input-label-text">Enter 6 digit Code</label>
                <div class="input-icon-wrap">
                  <i class="fa fa-key input-lead-icon" aria-hidden="true"></i>
                  <input
                    [class.error]="recovery_code.invalid && (recovery_code.dirty || recovery_code['touched'])"
                    type="text"
                    formControlName="recovery_code"
                    class="login-control"
                    placeholder="6 digit code"
                  />
                </div>
                <div *ngIf="recovery_code.invalid && (recovery_code.dirty || recovery_code['touched'])">
                  <p *ngIf="recovery_code.errors['required']" class="text-danger">Recovery code is required</p>
                </div>
              </div>

              <!-- New password -->
              <div class="form-group">
                <label class="input-label-text">Enter New Password</label>
                <div class="input-icon-wrap">
                  <i class="fa fa-lock input-lead-icon" aria-hidden="true"></i>
                  <input
                    [class.error]="new_password.invalid && (new_password.dirty || new_password['touched'])"
                    [type]="showPassword ? 'text' : 'password'"
                    formControlName="new_password"
                    class="login-control has-trail"
                    placeholder="New Password"
                  />
                  <button
                    type="button"
                    class="pw-toggle"
                    (click)="showPassword = !showPassword"
                    [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                  >
                    <i class="fa" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
                  </button>
                </div>
                <div *ngIf="new_password.invalid && (new_password.dirty || new_password['touched'])">
                  <p *ngIf="new_password.errors['required']" class="text-danger">New password is required</p>
                </div>
              </div>

              <div class="form-group">
                <button
                  class="kx-create-btn"
                  type="submit"
                  [disabled]="!resetPasswordForm.valid"
                  name="submit"
                  id="submit"
                >
                  <i *ngIf="isWaitingFlag" class="fa fa-spinner fa-spin" aria-hidden="true"></i>
                  Reset
                </button>
              </div>

              <p class="auth-footer-text">
                Remember your password?
                <a routerLink="/login">Back to login</a>
              </p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</login-layout>
