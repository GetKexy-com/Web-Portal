name: Deploy Angular App to S3 + CloudFront

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js (pinned to exact version)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.19.1'

      # 3. Install dependencies (with cache)
      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # 4. Build Angular app (with production config)
      - name: Build Angular app
        run: npm run build -- --configuration=production

      # 5. Verify build output (debugging step)
      - name: Verify build files
        run: |
          echo "Build directory contents:"
          ls -R ./dist
          echo "Checking for index.html:"
          ls ./dist/kexy-brand-portal/browser/index.html || echo "index.html not found!"

      # 6. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 7. Sync build to S3 (with proper caching headers)
      #
      # Two classes of file, and they must NOT share a rule:
      #
      #   * Build output (main-<hash>.js, styles-<hash>.css, chunk-<hash>.js, media/)
      #     is content-addressed — the filename changes whenever the bytes do — so it
      #     is safe to cache forever. `immutable` additionally stops the browser
      #     revalidating on a manual refresh.
      #
      #   * Everything under assets/ is copied VERBATIM by Angular and keeps its name
      #     across releases. It previously fell into the same one-year rule, which
      #     meant a change to e.g. assets/countries.js never reached a returning
      #     visitor: the CloudFront invalidation below clears the EDGE, but nothing
      #     clears a browser cache that was told to hold the file for a year.
      - name: Upload build to S3 with cache control
        run: |
          BROWSER_DIST=./dist/kexy-brand-portal/browser
          BUCKET=s3://${{ secrets.S3_BUCKET }}

          # Content-addressed build output — cache forever.
          aws s3 sync "$BROWSER_DIST" "$BUCKET" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html" \
            --exclude "assets/*" \
            --exclude "favicon.ico"

          # Unhashed, stable filenames — short TTL so an updated asset actually lands.
          aws s3 sync "$BROWSER_DIST/assets" "$BUCKET/assets" \
            --delete \
            --cache-control "public, max-age=300"

          aws s3 cp "$BROWSER_DIST/favicon.ico" "$BUCKET/favicon.ico" \
            --cache-control "public, max-age=300"

          # The entry point. Must revalidate every load: it is the only file naming
          # the current hashed bundles, so a stale copy points at deleted files.
          aws s3 cp "$BROWSER_DIST/index.html" "$BUCKET/index.html" \
            --cache-control "no-cache"

      # 8. Invalidate CloudFront cache
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"